name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  api:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research_desk
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: research_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333

    env:
      DATABASE_URL: postgresql://research_desk:devpassword@localhost:5432/research_desk
      QDRANT_URL: http://localhost:6333
      GEMINI_API_KEY: mock-api-key-for-ci
      APP_ENV: local
      AUTH_MODE: dev
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Type check with mypy
        run: python -m mypy src

      - name: Run Alembic migrations on empty database
        run: python -m alembic upgrade head

      - name: Initialize Qdrant collection
        run: python scripts/migrate_qdrant.py

      - name: Run backend tests with Pytest
        run: python -m pytest

  web:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check with TypeScript
        run: npm run typecheck

      - name: Lint with ESLint
        run: npm run lint

      - name: Run frontend tests with Vitest
        run: npm test
