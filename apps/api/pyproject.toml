[project]
name = "research-desk-api"
version = "0.1.0"
description = "FastAPI backend for Research Desk multi-agent research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",
    "google-genai>=0.1.1",
    "greenlet>=3.1.0",
    "pypdf>=5.0.0",
    "readability-lxml>=0.9",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.18",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_desk"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "TID",  # flake8-tidy-imports (banned-api rule TID251)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"qdrant_client".msg = "Module boundary violation: only stores/vector.py may import qdrant_client."
"google.genai".msg = "Module boundary violation: only providers/gemini.py may import the Gemini SDK."
"google.generativeai".msg = "Module boundary violation: only providers/gemini.py may import the Gemini SDK."
"sqlalchemy".msg = "Module boundary violation: only stores/ and stores/repos/ may import sqlalchemy."

[tool.ruff.lint.per-file-ignores]
"src/research_desk/stores/vector.py" = ["TID251"]
"src/research_desk/providers/gemini.py" = ["TID251"]
"src/research_desk/stores/*.py" = ["TID251"]
"src/research_desk/stores/repos/*.py" = ["TID251"]
"alembic/**/*.py" = ["TID251"]
"scripts/*.py" = ["TID251"]
"tests/**/*.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
native_parser = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
